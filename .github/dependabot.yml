# Dependabot config — SCA-744.
#
# The release workflow handles TAURI_SIGNING_PRIVATE_KEY at signing
# time, so a malicious tag-move on any `uses:` in `.github/workflows/`
# is a high-leverage supply-chain risk. Dependabot watches the
# `github-actions` ecosystem and opens PRs as new versions ship, so we
# stay current without manually chasing release notes.
#
# Future hardening: once Dependabot has rotated the first round of
# PRs, switch to full-SHA pins in the workflow files (with `# vX.Y.Z`
# comments) and Dependabot will continue to update them in place.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
      include: scope
