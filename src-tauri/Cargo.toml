[package]
name = "promptibrary"
version = "0.0.0"
description = "Promptibrary — agentic-coding operator console for Claude Code."
authors = ["Scalinity"]
license = "UNLICENSED"
repository = "https://github.com/scalinity/Promptibrary"
edition = "2021"
rust-version = "1.77"

[lib]
# Required by Tauri 2 — the bin entry calls `promptibrary_lib::run()`.
name = "promptibrary_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri runtime + plugins (spec §2)
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7"
tauri-plugin-updater = "2.10"

# Async runtime
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "fs", "io-util", "process", "signal", "sync", "time"] }

# Serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Errors
thiserror = "2"

# IDs and time
ulid = { version = "1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }

# SQLite (sqlx)
sqlx = { version = "=0.8.6", features = ["runtime-tokio", "tls-rustls", "sqlite", "chrono", "migrate"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Filesystem watching (spec §2)
notify = "=8.2.0"

# HTTP (spec §2). `rustls-tls` was renamed to `rustls` in reqwest 0.13.
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "gzip", "brotli"] }

# URL parsing for source detection + canonicalization (spec §6).
url = "2"
percent-encoding = "2"

# HTML scraping for the generic article fetcher (spec §6). `html5ever` /
# `scraper` give us a DOM + CSS-selector API without reimplementing a parser.
scraper = "0.20"

# Async trait sugar for the Anthropic client + fetcher abstraction.
async-trait = "0.1"

# Keychain (spec §13). `keyring-core` defines the trait; platform backends
# are pulled in target-conditionally below so headless CI doesn't need D-Bus
# running. All code paths go through `settings::secret_store::SecretStore`
# so tests use an in-memory store and never touch the real keychain.
keyring-core = "1"

# Local vector search + embeddings
sqlite-vec = "=0.1.9"
# fastembed = "5.13"   # TODO(L5): re-enable when ONNX runtime is wired up; pulls in ort/onnxruntime native deps
# git2 = "0.20"        # TODO(L5): re-enable for Git history; libgit2 build adds ~30s
# portable-pty = "=0.9.0"  # TODO(L3): re-enable when launch pipeline lands

# Hashing for prompt checksums
sha2 = "0.10"

# Regex for variable `pattern` validation per spec §5.
regex = { version = "1", default-features = false, features = ["std", "unicode-perl"] }

# Utility
once_cell = "1"
parking_lot = "0.12"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.40", features = ["full", "test-util"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust", "vendored"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"

[features]
# By default, Tauri 2 uses the custom protocol on Windows/Linux/macOS.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
