<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Surfaces & Borders — Promptibrary</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../typography.css">
<link rel="stylesheet" href="../base.css">
<style>
  body { padding: 24px; background: var(--bg-deep); width: 700px; }
  .card-title {
    font-family: var(--font-display);
    font-style: italic;
    font-size: 12px;
    color: var(--ink-tertiary);
    text-transform: lowercase;
    letter-spacing: 0.02em;
    margin-bottom: 14px;
  }
  .card-title::before { content: "§"; color: var(--ink-dim); margin-right: 6px; font-style: normal; }
  .swatches { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .sw {
    border: var(--hairline);
    border-radius: var(--r-md);
    overflow: hidden;
    background: var(--bg-base);
  }
  .sw .chip { height: 76px; border-bottom: var(--hairline); }
  .sw .meta { padding: 8px 10px 10px; }
  .sw .name { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-primary); letter-spacing: 0.01em; }
  .sw .val  { font-family: var(--font-mono); font-size: 9.5px; color: var(--ink-tertiary); letter-spacing: 0.01em; margin-top: 2px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 12px; }
  .border-demo {
    background: var(--bg-raised);
    border-radius: var(--r-md);
    padding: 18px 14px;
    text-align: center;
  }
  .border-demo .line { height: 1px; margin: 12px 0 10px; }
  .border-demo .name { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-primary); }
  .border-demo .val { font-family: var(--font-mono); font-size: 9.5px; color: var(--ink-tertiary); margin-top: 2px; }
</style>
</head>
<body>
  <div class="card-title">surfaces — dark, cool-cyan undertone</div>
  <div class="swatches">
    <div class="sw"><div class="chip" style="background:var(--bg-deep)"></div><div class="meta"><div class="name">bg-deep</div><div class="val">L 0.135</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--bg-base)"></div><div class="meta"><div class="name">bg-base</div><div class="val">L 0.170</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--bg-raised)"></div><div class="meta"><div class="name">bg-raised</div><div class="val">L 0.205</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--bg-sunken)"></div><div class="meta"><div class="name">bg-sunken</div><div class="val">L 0.110</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--bg-terminal)"></div><div class="meta"><div class="name">bg-terminal</div><div class="val">L 0.095</div></div></div>
  </div>

  <div class="row2">
    <div class="border-demo">
      <div class="line" style="background:var(--border-subtle)"></div>
      <div class="name">border-subtle</div>
      <div class="val">default 1px hairline</div>
    </div>
    <div class="border-demo">
      <div class="line" style="background:var(--border-mid)"></div>
      <div class="name">border-mid</div>
      <div class="val">hover state</div>
    </div>
    <div class="border-demo">
      <div class="line" style="background:var(--border-strong)"></div>
      <div class="name">border-strong</div>
      <div class="val">deliberate emphasis</div>
    </div>
  </div>
</body>
</html>
