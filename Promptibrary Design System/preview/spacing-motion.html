<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motion</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../typography.css">
<link rel="stylesheet" href="../base.css">
<style>
  body { padding: 24px 28px; background: var(--bg-base); width: 700px; }
  .row {
    display: grid;
    grid-template-columns: 130px 60px 1fr 120px;
    align-items: center;
    gap: 16px;
    padding: 11px 0;
    border-bottom: 1px dashed var(--border-subtle);
  }
  .row:last-child { border-bottom: none; }
  .name { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-primary); letter-spacing: 0.01em; }
  .dur  { font-family: var(--font-mono); font-size: 10.5px; color: var(--accent-warm); letter-spacing: 0.01em; }
  .use  { font-family: var(--font-ui); font-size: 12px; color: var(--ink-secondary); }
  .demo { display: flex; justify-content: flex-end; }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--status-running);
    box-shadow: 0 0 6px var(--status-running);
    animation: pb-dot-glow 1800ms ease-in-out infinite;
  }
  .ring {
    width: 12px; height: 12px; border-radius: 2px;
    background: var(--bg-sunken); border: 1px solid var(--accent-deep);
    animation: pb-glow 2400ms ease-in-out infinite;
  }
  .cursor { font-family: var(--font-mono); font-size: 14px; color: var(--accent); animation: pb-blink 1000ms steps(2) infinite; }
  .spine { width: 3px; height: 22px; background: var(--status-running); animation: pb-spine-pulse 1800ms ease-in-out infinite; }
  .snap-bar { width: 60px; height: 6px; background: var(--bg-sunken); border-radius: 3px; position: relative; }
  .snap-bar::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 60%; background: var(--accent); border-radius: 3px; }
</style>
</head>
<body>
  <div class="row"><div class="name">--motion-instant</div><div class="dur">80ms</div><div class="use">bg-color on hover</div><div class="demo"><div class="snap-bar"></div></div></div>
  <div class="row"><div class="name">--motion-snap</div><div class="dur">120ms</div><div class="use">borders, button states</div><div class="demo"><div class="snap-bar"></div></div></div>
  <div class="row"><div class="name">--motion-glide</div><div class="dur">200ms</div><div class="use">panes, modals enter</div><div class="demo"><div class="snap-bar"></div></div></div>
  <div class="row"><div class="name">--motion-pulse</div><div class="dur">1800ms</div><div class="use">running indicators</div><div class="demo"><div class="dot"></div></div></div>
  <div class="row"><div class="name">spine pulse</div><div class="dur">1800ms</div><div class="use">running prompt row</div><div class="demo"><div class="spine"></div></div></div>
  <div class="row"><div class="name">--motion-glow</div><div class="dur">2400ms</div><div class="use">empty-required field</div><div class="demo"><div class="ring"></div></div></div>
  <div class="row"><div class="name">--motion-blink</div><div class="dur">1000ms</div><div class="use">terminal cursor</div><div class="demo"><div class="cursor">▍</div></div></div>
</body>
</html>
