<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mono — JetBrains</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../typography.css">
<link rel="stylesheet" href="../base.css">
<style>
  body { padding: 24px 28px; background: var(--bg-terminal); width: 700px; }
  .row { display: grid; grid-template-columns: 56px 1fr 110px; align-items: baseline; gap: 18px; padding: 12px 0; border-bottom: 1px dashed var(--border-subtle); }
  .row:last-child { border-bottom: none; }
  .tag { font-family: var(--font-mono); font-size: 10px; color: var(--ink-dim); letter-spacing: 0.06em; text-transform: uppercase; }
  .meta { font-family: var(--font-mono); font-size: 10px; color: var(--ink-tertiary); text-align: right; letter-spacing: 0.01em; }
  .header {
    font-family: var(--font-display);
    font-style: italic;
    font-size: 12px;
    color: var(--ink-tertiary);
    text-transform: lowercase;
    margin-bottom: 10px;
    letter-spacing: 0.02em;
  }
  .header::before { content: "§"; color: var(--ink-dim); margin-right: 6px; font-style: normal; }
  .glyph { color: var(--accent); }
  .var-inline { background: var(--accent-tint); color: var(--accent-warm); font-style: italic; padding: 1px 4px; border-radius: 2px; }
  .path { color: var(--term-path); }
  .num { color: var(--status-warn); }
</style>
</head>
<body>
  <div class="header">mono — jetbrains mono variable</div>
  <div class="row">
    <div class="tag">M</div>
    <div class="t-mono" style="color:var(--ink-secondary)"><span class="glyph">›</span> resolve <span class="var-inline">{{repo}}</span> at HEAD; isolate <span class="path">src/lib/stream.ts</span></div>
    <div class="meta">12.5 / 1.65</div>
  </div>
  <div class="row">
    <div class="tag">S</div>
    <div class="t-mono-s" style="color:var(--ink-tertiary)">repo ~/code/aurora · model sonnet-4.5 · mcp playwright · shell zsh</div>
    <div class="meta">11 / 1.50</div>
  </div>
  <div class="row">
    <div class="tag">XS</div>
    <div class="t-mono-xs t-mono-instrument" style="color:var(--ink-tertiary)">⌘K&nbsp;&nbsp;⌘N&nbsp;&nbsp;⌘I&nbsp;&nbsp;⌘↵&nbsp;&nbsp;⌘.&nbsp;&nbsp;⌘[</div>
    <div class="meta">10.5 / .04em</div>
  </div>
</body>
</html>
